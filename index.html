<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAYYDS | E-Commerce Visual Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    .neon-glow {
      box-shadow: 0 0 50px -10px rgba(37, 99, 235, 0.4);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(59, 130, 246, 0.25);
    }
    .badge-glow {
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-10 relative">

  <!-- Arka Plan Mavi Stüdyo Işıkları -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[700px] h-[500px] bg-blue-600/15 rounded-full blur-[140px] pointer-events-none -z-10"></div>
  <div class="absolute top-10 left-10 w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

  <!-- Üst Menü / Header -->
  <header class="max-w-6xl w-full mx-auto flex justify-between items-center pb-6 border-b border-slate-800/80">
    <div class="text-2xl font-black tracking-widest text-white">MAYY<span class="text-blue-500">DS</span></div>
    <div class="flex items-center gap-6 text-sm">
      <a href="https://mayysev.com/" target="_blank" class="text-slate-400 hover:text-white transition">Mayysev</a>
      <a href="https://www.netafix.com.tr/" target="_blank" class="text-slate-400 hover:text-white transition">Netafix</a>
      <a href="https://wa.me/905531600042" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl font-semibold transition shadow-lg shadow-blue-600/30">İletişim</a>
    </div>
  </header>

  <!-- Vitrin / Hero Sahnesi -->
  <main class="max-w-6xl w-full mx-auto my-8 md:my-12">
    <div class="relative w-full rounded-3xl p-6 md:p-12 glass-card neon-glow border border-blue-500/30 overflow-hidden flex flex-col lg:flex-row items-center justify-between gap-10">
      
      <!-- Sol Taraf: Ana Ürün Vitrini (Saat & Profesyonel Rozet) -->
      <div class="relative w-full lg:w-5/12 flex flex-col items-center justify-center">
        <!-- %100 Profesyonel Düzenleme Rozeti -->
        <div class="absolute -top-4 left-2 md:left-6 z-20 glass-card px-4 py-2.5 rounded-2xl flex items-center gap-3 border border-blue-500/40 badge-glow">
          <div class="text-left">
            <div class="text-[11px] font-bold text-white leading-tight">%100</div>
            <div class="text-[10px] text-slate-300">Profesyonel Düzenleme</div>
          </div>
          <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-check"></i>
          </div>
        </div>

        <!-- Vitrin Saati Görseli -->
        <div class="relative w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl border border-slate-700/50 bg-slate-900/50">
          <img src="Gemini_Generated_Image_jpwjq0jpwjq0jpwj.jpg" alt="MAYYDS Saat Vitrini" class="w-full h-80 md:h-96 object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          <div class="absolute bottom-4 left-6">
            <span class="text-xs tracking-widest text-blue-400 font-semibold uppercase">MAYYDS STUDIO</span>
            <h3 class="text-lg font-bold text-white">Lüks Ürün Retouch & Sahneleme</h3>
          </div>
        </div>
      </div>

      <!-- Orta / Sağ Taraf: Düzenleme Paneli (macOS UI + Before/After + Amazon Kutusu) -->
      <div class="w-full lg:w-7/12 flex flex-col md:flex-row items-center gap-6">
        
        <!-- macOS Stili Photoshop Düzenleme Ekranı -->
        <div class="w-full md:w-8/12 bg-slate-900/90 rounded-2xl border border-slate-700/80 shadow-2xl overflow-hidden">
          <!-- macOS Bar -->
          <div class="bg-slate-950/80 px-4 py-3 flex items-center gap-2 border-b border-slate-800">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
            <span class="text-[11px] text-slate-400 ml-2 font-mono">editor_workspace.mayyds</span>
          </div>

          <!-- Çalışma Alanı: Araç Çubuğu + Karşılaştırma Görselleri -->
          <div class="p-4 flex gap-3">
            <!-- Sol Mini Araç Çubuğu -->
            <div class="flex flex-col gap-3 text-slate-400 text-xs border-r border-slate-800 pr-3 pt-1">
              <i class="fa-solid fa-crop-simple hover:text-blue-400 cursor-pointer"></i>
              <i class="fa-solid fa-wand-magic-sparkles hover:text-blue-400 cursor-pointer text-blue-400"></i>
              <i class="fa-solid fa-brush hover:text-blue-400 cursor-pointer"></i>
              <i class="fa-solid fa-font hover:text-blue-400 cursor-pointer"></i>
              <i class="fa-solid fa-sliders hover:text-blue-400 cursor-pointer"></i>
              <i class="fa-solid fa-layer-group hover:text-blue-400 cursor-pointer"></i>
            </div>

            <!-- Before & After Karşılaştırma Alanı -->
            <div class="grid grid-cols-2 gap-2 flex-1 relative items-center">
              <!-- Öncesi (Before) -->
              <div class="relative rounded-lg overflow-hidden border border-slate-800 bg-slate-950">
                <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-md text-[10px] px-2 py-0.5 rounded text-slate-300 font-medium z-10">Öncesi</span>
                <img src="Gemini_Generated_Image_lmclflpmclflpmcl.jpg" alt="Öncesi" class="w-full h-44 object-cover">
              </div>

              <!-- Ortadaki Ok Simgesi -->
              <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-7 h-7 bg-white text-slate-900 rounded-full flex items-center justify-center text-xs font-bold shadow-lg">
                <i class="fa-solid fa-arrow-right"></i>
              </div>

              <!-- Sonrası (After) -->
              <div class="relative rounded-lg overflow-hidden border border-blue-500/40 bg-slate-950">
                <span class="absolute top-2 left-2 bg-blue-600 text-[10px] px-2 py-0.5 rounded text-white font-medium z-10">Sonrası</span>
                <img src="Gemini_Generated_Image_mkv2opmkv2opmkv2.jpg" alt="Sonrası" class="w-full h-44 object-cover">
              </div>
            </div>
          </div>
        </div>

        <!-- Sağ Taraf: Kontrol Listesi ve Amazon Kutusu -->
        <div class="w-full md:w-4/12 flex flex-col gap-4">
          
          <!-- Özellikler Listesi (Tikli Panel) -->
          <div class="glass-card rounded-2xl p-4 border border-blue-500/30 space-y-2.5">
            <div class="flex items-center justify-between text-xs font-medium text-slate-200">
              <span>Beyaz Arka Plan</span>
              <i class="fa-solid fa-circle-check text-blue-500 text-sm"></i>
            </div>
            <div class="flex items-center justify-between text-xs font-medium text-slate-200">
              <span>Renk Düzenleme</span>
              <i class="fa-solid fa-circle-check text-blue-500 text-sm"></i>
            </div>
            <div class="flex items-center justify-between text-xs font-medium text-slate-200">
              <span>Ürün Retouch</span>
              <i class="fa-solid fa-circle-check text-blue-500 text-sm"></i>
            </div>
            <div class="flex items-center justify-between text-xs font-medium text-slate-200">
              <span>Shadow & Işık</span>
              <i class="fa-solid fa-circle-check text-blue-500 text-sm"></i>
            </div>
          </div>

          <!-- Amazon / Mockup Kutusu -->
          <div class="relative glass-card rounded-2xl p-3 border border-blue-500/30 group overflow-hidden">
            <i class="fa-brands fa-amazon absolute top-3 right-3 text-lg text-amber-500 z-10"></i>
            <div class="rounded-xl overflow-hidden bg-white/5 mb-2">
              <img src="Gemini_Generated_Image_oungxkoungxkoung.jpg" alt="Amazon Mockup" class="w-full h-28 object-cover">
            </div>
            <!-- Renk Paleti Çubuğu -->
            <div class="flex gap-1.5 justify-center">
              <div class="w-4 h-3 rounded bg-cyan-400"></div>
              <div class="w-4 h-3 rounded bg-blue-600"></div>
              <div class="w-4 h-3 rounded bg-indigo-800"></div>
              <div class="w-4 h-3 rounded bg-slate-700"></div>
            </div>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- Alt Bilgi / Footer -->
  <footer class="max-w-6xl w-full mx-auto pt-6 border-t border-slate-800/80 flex flex-col md:flex-row justify-between items-center text-xs text-slate-500 gap-4">
    <div>© 2026 MAYYDS Visual Studio. Tüm hakları saklıdır.</div>
    <div class="flex gap-6 text-slate-400">
      <a href="https://mayyds.vercel.app/" class="hover:text-white transition">Portföy</a>
      <a href="https://linkedin.com/in/mehmet-ali-yilmaz" target="_blank" class="hover:text-white transition">LinkedIn</a>
    </div>
  </footer>

</body>
</html>
